<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Retro Space Spider Shooter</title><style>body { margin: 0; padding: 0; background: #000; color: #0f0; font-family: monospace; display: flex; justify-content: center; align-items: center; height: 100vh; } canvas { border: 1px solid #0f0; } #ui { position: absolute; top: 10px; left: 10px; }</style></head><body><div id="ui">Score: 0 | Lives: 5</div><canvas id="gameCanvas" width="800" height="600"></canvas><script>const canvas = document.getElementById('gameCanvas');const ctx = canvas.getContext('2d');let spaceship = { x: canvas.width / 2 - 15, y: canvas.height - 30, width: 30, height: 20 };let bullets = [];let spiders = [];let score = 0;let lives = 5;let keys = {};let lastShot = 0;let gameOver = false;let invincible = false;function gameLoop() { update(); draw(); if (!gameOver) { requestAnimationFrame(gameLoop); } }function update() { if (keys.ArrowLeft && spaceship.x > 0) spaceship.x -= 5; if (keys.ArrowRight && spaceship.x < canvas.width - spaceship.width) spaceship.x += 5; bullets.forEach((b, i) => { b.y -= 10; if (b.y < 0) bullets.splice(i, 1); }); spiders.forEach((s, i) => { s.y += 1.5; if (s.y > canvas.height) { spiders.splice(i, 1); if (!invincible) { lives--; invincible = true; setTimeout(() => invincible = false, 1000); if (lives <= 0) gameOver = true; } } }); if (Math.random() < 0.005 && spiders.length < 5) { spiders.push({ x: Math.random() * (canvas.width - 20), y: 0 }); } bullets.forEach((b, bi) => { spiders.forEach((s, si) => { if (b.x < s.x + 20 && b.x + 2 > s.x && b.y < s.y + 20 && b.y + 10 > s.y) { bullets.splice(bi, 1); spiders.splice(si, 1); score += 10; } }); }); spiders.forEach((s, i) => { if (s.x < spaceship.x + spaceship.width && s.x + 20 > spaceship.x && s.y < spaceship.y + spaceship.height && s.y + 20 > spaceship.y && !invincible) { spiders.splice(i, 1); lives--; invincible = true; setTimeout(() => invincible = false, 1000); if (lives <= 0) gameOver = true; } }); }function draw() { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = '#0f0'; ctx.beginPath(); ctx.moveTo(spaceship.x + spaceship.width / 2, spaceship.y); ctx.lineTo(spaceship.x, spaceship.y + spaceship.height); ctx.lineTo(spaceship.x + spaceship.width, spaceship.y + spaceship.height); ctx.closePath(); ctx.fill(); ctx.fillRect(spaceship.x + 5, spaceship.y + spaceship.height, 5, 3); ctx.fillRect(spaceship.x + spaceship.width - 10, spaceship.y + spaceship.height, 5, 3); bullets.forEach(b => { ctx.fillStyle = '#fff'; ctx.fillRect(b.x, b.y, 2, 10); }); spiders.forEach(s => { ctx.fillStyle = '#f00'; ctx.beginPath(); ctx.ellipse(s.x + 10, s.y + 10, 8, 5, 0, 0, 2 * Math.PI); ctx.fill(); ctx.strokeStyle = '#f00'; ctx.lineWidth = 1; for (let i = 0; i < 8; i++) { const angle = (i * Math.PI) / 4; const legLength = 10; ctx.beginPath(); ctx.moveTo(s.x + 10, s.y + 10); ctx.lineTo(s.x + 10 + Math.cos(angle) * legLength, s.y + 10 + Math.sin(angle) * legLength); ctx.stroke(); } }); document.getElementById('ui').textContent = `Score: ${score} | Lives: ${lives}`; if (gameOver) { ctx.fillStyle = '#fff'; ctx.font = '30px monospace'; ctx.fillText('Game Over! Press R to Restart', canvas.width / 2 - 200, canvas.height / 2); } }function shoot() { const now = Date.now(); if (now - lastShot > 200) { bullets.push({ x: spaceship.x + spaceship.width / 2 - 1, y: spaceship.y }); lastShot = now; } }function restart() { spaceship = { x: canvas.width / 2 - 15, y: canvas.height - 30, width: 30, height: 20 }; bullets = []; spiders = []; score = 0; lives = 5; gameOver = false; invincible = false; gameLoop(); }document.addEventListener('keydown', (e) => { keys[e.code] = true; if (e.code === 'Space') { e.preventDefault(); shoot(); } if (e.code === 'KeyR' && gameOver) { restart(); } });document.addEventListener('keyup', (e) => { keys[e.code] = false; });gameLoop();</script></body></html>
